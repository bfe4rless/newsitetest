<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XtroasGPT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --ink:#16181C; --muted:#6C707A; --line:#DFE1DC;
  --accent:#D9822B; --accent-soft:#F4E2CE; --side:#EAEBE7; --user:#16181C; --user-ink:#F3F4F1;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0F12; --surface:#16181D; --ink:#ECEDEA; --muted:#8B8F99; --line:#24272E;
  --accent:#F0A04B; --accent-soft:#2B2116; --side:#0A0B0D; --user:#ECEDEA; --user-ink:#0E0F12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0F12; --surface:#16181D; --ink:#ECEDEA; --muted:#8B8F99; --line:#24272E;
  --accent:#F0A04B; --accent-soft:#2B2116; --side:#0A0B0D; --user:#ECEDEA; --user-ink:#0E0F12; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased;
  display:flex;overflow:hidden;transition:background .4s var(--ease),color .4s var(--ease)}
.app{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}

aside{width:268px;flex:none;height:100%;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;
  padding:max(14px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  transition:margin-left .45s var(--ease),transform .45s var(--ease)}
body.side-closed aside{margin-left:-268px}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 14px}
.side-top .brand{font-size:17px}
.newbtn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  font-size:14px;font-weight:500;transition:border-color .2s,transform .3s var(--ease)}
.newbtn:hover{border-color:var(--accent)}
.newbtn svg{color:var(--accent)}
.chatlist{flex:1;overflow-y:auto;margin-top:14px;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.group{font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.group:first-child{padding-top:4px}
.chatitem{position:relative;display:flex;align-items:center;border-radius:10px;transition:background .2s}
.chatitem:hover{background:var(--surface)}
.chatitem.active{background:var(--surface)}
.chatitem.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.chatitem .open{flex:1;min-width:0;text-align:left;padding:9px 6px 9px 12px;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.chatitem.active .open,.chatitem:hover .open{color:var(--ink)}
.chatitem .del{width:28px;height:28px;margin-right:4px;display:grid;place-items:center;border-radius:8px;color:var(--muted);opacity:0;transition:opacity .2s,color .2s,background .2s;flex:none}
.chatitem:hover .del,.chatitem .del:focus-visible,.chatitem .del.armed{opacity:1}
.chatitem .del:hover{color:var(--ink)}
.chatitem .del.armed{color:#fff;background:#C2412D;width:auto;padding:0 9px;font-size:12px}
.empty-side{color:var(--muted);font-size:13px;padding:10px 12px;line-height:1.5}
.scrim{display:none}
@media (min-width:821px){body:not(.side-closed) #sideOpen,body:not(.side-closed) #topBrand{display:none}}
@media (max-width:820px){
  aside{position:fixed;inset:0 auto 0 0;z-index:30;transform:translateX(-100%);margin-left:0!important;box-shadow:20px 0 60px -30px rgba(0,0,0,.5)}
  body.side-open aside{transform:none}
  .scrim{display:block;position:fixed;inset:0;z-index:29;background:color-mix(in srgb,var(--bg) 50%,transparent);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s}
  body.side-open .scrim{opacity:1;pointer-events:auto}
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg{display:block}

.left{display:flex;align-items:center;gap:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px max(20px,env(safe-area-inset-right)) 14px max(20px,env(safe-area-inset-left));
  padding-top:max(14px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:-.02em}
.brand small{font-family:var(--mono);font-size:10px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--line);border-radius:99px;padding:2px 8px}
.tools{display:flex;align-items:center;gap:4px}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--muted);transition:background .2s,color .2s}
.iconbtn:hover{background:var(--surface);color:var(--ink)}

main{flex:1;overflow-y:auto;scroll-behavior:smooth}
.col{max-width:720px;margin:0 auto;padding-inline:max(20px,env(safe-area-inset-left))}
#feed{display:flex;flex-direction:column;gap:28px;padding-block:24px 40px}

.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-block:7vh 8px;gap:22px;animation:rise .9s var(--ease) both}
.hero h1{margin:0;font-family:var(--display);font-weight:300;font-size:clamp(34px,6vw,54px);line-height:1.02;letter-spacing:-.04em;text-wrap:balance}
.hero h1 em{font-style:normal;font-weight:600;color:var(--accent)}
.hero p{margin:0;color:var(--muted);max-width:40ch}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;margin-top:14px}
.chip{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);
  transition:transform .35s var(--ease),border-color .25s;color:var(--ink)}
.chip:hover{transform:translateY(-2px);border-color:var(--accent)}
.chip svg{flex:none;color:var(--accent);margin-top:2px}
.chip b{display:block;font-weight:500;font-size:14px}
.chip span{display:block;color:var(--muted);font-size:13px;line-height:1.4}

.orbit{width:var(--s,96px);height:var(--s,96px);color:var(--ink)}
.orbit .ring{transform-origin:50% 50%;animation:spin 18s linear infinite}
.orbit .ring2{transform-origin:50% 50%;animation:spin 28s linear infinite reverse}
.orbit .sat{fill:var(--accent)}
.orbit .core{fill:var(--ink)}
.thinking .orbit .ring{animation-duration:1.6s}
.thinking .orbit .ring2{animation-duration:2.6s}

.msg{display:flex;gap:14px;animation:rise .5s var(--ease) both;min-width:0}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:var(--user);color:var(--user-ink);padding:10px 16px;border-radius:18px 18px 4px 18px;max-width:80%;white-space:pre-wrap;word-wrap:break-word}
.msg.ai .av{flex:none;--s:28px;margin-top:2px}
.msg.ai .body{min-width:0;flex:1}
.prose>*:first-child{margin-top:0}.prose>*:last-child{margin-bottom:0}
.prose p{margin:.6em 0}
.prose h1,.prose h2,.prose h3{font-family:var(--display);letter-spacing:-.02em;line-height:1.2;margin:1.2em 0 .4em;font-weight:600}
.prose h1{font-size:22px}.prose h2{font-size:19px}.prose h3{font-size:16px}
.prose ul,.prose ol{padding-left:1.3em;margin:.6em 0}
.prose li{margin:.2em 0}
.prose a{color:var(--accent)}
.prose code{font:13px var(--mono);background:var(--accent-soft);padding:1px 6px;border-radius:6px}
.prose pre{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow-x:auto;margin:.8em 0}
.prose pre code{background:none;padding:0;font-size:13px;line-height:1.55}
.prose blockquote{margin:.6em 0;padding-left:14px;border-left:2px solid var(--accent);color:var(--muted)}
.cursor{display:inline-block;width:7px;height:15px;background:var(--accent);vertical-align:-2px;margin-left:2px;border-radius:2px;animation:blink 1s steps(2) infinite}
.actions{display:flex;gap:2px;margin-top:8px;opacity:0;transition:opacity .25s}
.msg.ai:hover .actions,.msg.ai:focus-within .actions{opacity:1}
.actions .iconbtn{width:30px;height:30px}
.err{color:#C2412D;font-size:14px}

.code-block-wrap { position: relative; margin: .8em 0; }
.code-block-wrap pre { margin: 0; }
.code-actions {
  position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; opacity: 0;
  transition: opacity .2s; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 2px;
}
.code-block-wrap:hover .code-actions { opacity: 1; }
.code-action-btn {
  width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px;
  color: var(--muted); transition: background .2s, color .2s;
}
.code-action-btn:hover { background: var(--line); color: var(--ink); }

footer{padding-bottom:max(18px,env(safe-area-inset-bottom))}
.composer{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:8px 8px 8px 18px;
  box-shadow:0 10px 40px -18px rgba(0,0,0,.25);transition:border-color .25s,box-shadow .25s}
.composer:focus-within{border-color:var(--line)}
.dock{position:relative}
.glow{position:absolute;left:50%;top:calc(100% + 14px);height:5px;width:0;border-radius:99px;transform:translateX(-50%);
  background:var(--accent);box-shadow:0 0 14px 2px color-mix(in srgb,var(--accent) 70%,transparent),0 0 34px 6px color-mix(in srgb,var(--accent) 30%,transparent);
  opacity:0;transition:width .6s var(--ease),opacity .4s var(--ease);pointer-events:none}
.dock:focus-within .glow{width:62%;opacity:1}
.hint{transition:opacity .3s}
.dock:focus-within + .hint{opacity:0}
textarea{flex:1;min-width:0;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font:15px/1.5 var(--body);padding:8px 0;max-height:200px}
textarea::placeholder{color:var(--muted)}
.send{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--ink);color:var(--bg);flex:none;transition:transform .25s var(--ease),opacity .2s}
.send:hover{transform:scale(1.05)}
.send:disabled{opacity:.3;transform:none;cursor:default}
.hint{text-align:center;font:11px var(--mono);color:var(--muted);letter-spacing:.04em;margin-top:12px}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@media (max-width:560px){.chips{grid-template-columns:1fr}.brand small{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-orbit" viewBox="0 0 100 100">
    <g class="ring2"><ellipse cx="50" cy="50" rx="44" ry="17" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".35" transform="rotate(-28 50 50)"/></g>
    <g class="ring"><ellipse cx="50" cy="50" rx="44" ry="17" fill="none" stroke="currentColor" stroke-width="1.6" transform="rotate(32 50 50)"/>
      <circle class="sat" cx="87.3" cy="73.3" r="5.5"/></g>
    <circle class="core" cx="50" cy="50" r="11"/>
  </symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></symbol>
  <symbol id="i-new" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3c.6 4.6 2.4 6.4 7 7-4.6.6-6.4 2.4-7 7-.6-4.6-2.4-6.4-7-7 4.6-.6 6.4-2.4 7-7Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4ZM13 7l4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 12h17M12 3.5c2.5 2.6 3.5 5.4 3.5 8.5s-1 5.9-3.5 8.5c-2.5-2.6-3.5-5.4-3.5-8.5s1-5.9 3.5-8.5Z" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9.5 4.5v15" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12M6 10l6 6 6-6M4 20h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
</svg>

<aside id="side" aria-label="Saved chats">
  <div class="side-top">
    <div class="brand"><svg class="orbit" style="--s:24px"><use href="#i-orbit"/></svg>XtroasGPT</div>
    <button class="iconbtn" id="sideClose" aria-label="Close sidebar"><svg width="18" height="18"><use href="#i-panel"/></svg></button>
  </div>
  <button class="newbtn" id="sideNew"><svg width="18" height="18"><use href="#i-new"/></svg>New chat</button>
  <nav class="chatlist" id="chatlist"></nav>
</aside>
<div class="scrim" id="scrim"></div>

<div class="app">
<header>
  <div class="left">
    <button class="iconbtn" id="sideOpen" aria-label="Show saved chats"><svg width="18" height="18"><use href="#i-panel"/></svg></button>
    <div class="brand" id="topBrand"><svg class="orbit" style="--s:26px"><use href="#i-orbit"/></svg>XtroasGPT <small>3.5 Flash Lite</small></div>
  </div>
  <div class="tools">
    <button class="iconbtn" id="theme" aria-label="Toggle theme"><svg width="18" height="18"><use href="#i-moon"/></svg></button>
    <button class="iconbtn" id="newchat" aria-label="New chat"><svg width="18" height="18"><use href="#i-new"/></svg></button>
  </div>
</header>

<main id="scroller"><div class="col"><div id="feed"></div></div></main>

<footer><div class="col">
  <div class="dock">
  <form class="composer" id="form">
    <textarea id="input" rows="1" placeholder="Type a command..." autofocus></textarea>
    <button class="send" id="send" type="submit" aria-label="Send" disabled><svg width="18" height="18"><use href="#i-send"/></svg></button>
  </form>
  <div class="glow" aria-hidden="true"></div>
  </div>
  <div class="hint">Enter to send · Shift + Enter for a new line</div>
</div></footer>
</div>

<script>

const GREETING = "Welcome to Xtroas GPT";
// No API key here. The key and the model all live on the server.
// This page only ever talks to its own /api/chat endpoint.
const API_ENDPOINT = "/api/chat";

const $ = s => document.querySelector(s);
const feed = $("#feed"), input = $("#input"), send = $("#send"), form = $("#form"), scroller = $("#scroller");
const store = { get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}} };

let chats = store.get("xtroas.chats", []);
const legacy = store.get("xtroas.chat", null);
if(legacy && legacy.some(m=>m.role==="user") && !chats.length){ chats=[{id:"c"+Date.now(),updated:Date.now(),history:legacy}]; }
let currentId = store.get("xtroas.current", null);
let history = (chats.find(c=>c.id===currentId)||{}).history || [];
const hasUser = c => c.history.some(m=>m.role==="user");
const titleOf = c => { const u=c.history.find(m=>m.role==="user"); return u ? u.text.replace(/\s+/g," ").slice(0,48) : "New chat"; };
function persist(){ store.set("xtroas.chats", chats.filter(hasUser)); store.set("xtroas.current", currentId); }
function saveChat(){
  let c=chats.find(c=>c.id===currentId);
  if(!c){ c={id:currentId||("c"+Date.now()),updated:Date.now(),history}; currentId=c.id; chats.unshift(c); }
  c.history=history; c.updated=Date.now();
  persist(); renderSidebar();
}
let controller = null;

function applyTheme(t){ if(t) document.documentElement.dataset.theme=t; else delete document.documentElement.dataset.theme; syncThemeIcon(); }
function isDark(){ const t=document.documentElement.dataset.theme; return t? t==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function syncThemeIcon(){ $("#theme use").setAttribute("href", isDark()? "#i-sun" : "#i-moon"); }
$("#theme").onclick=()=>{ const t=isDark()?"light":"dark"; store.set("xtroas.theme",t); applyTheme(t); };
applyTheme(store.get("xtroas.theme",null));

const esc = s => s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function inline(s){
  return s.replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src){
  const blocks=[]; src=src.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,(_,l,c)=>{
    const cleanCode = c.replace(/\n$/,"");
    const isHtml = /<!DOCTYPE html>/i.test(cleanCode) || /<html[\s>]/i.test(cleanCode);
    blocks.push(`<div class="code-block-wrap"><pre><code>${esc(cleanCode)}</code></pre>
      <div class="code-actions">
        <button class="code-action-btn" data-action="copy" aria-label="Copy code"><svg width="14" height="14"><use href="#i-copy"/></svg></button>
        <button class="code-action-btn" data-action="download" data-is-html="${isHtml}" aria-label="Download code"><svg width="14" height="14"><use href="#i-download"/></svg></button>
        <button class="code-action-btn" data-action="run" aria-label="Run code"><svg width="14" height="14"><use href="#i-play"/></svg></button>
      </div>
    </div>`);
    return `\u0000${blocks.length-1}\u0000`;
  });
  const lines=esc(src).split("\n"); let out="",list=null,para=[];
  const flushP=()=>{if(para.length){out+=`<p>${inline(para.join("<br>"))}</p>`;para=[];}};
  const flushL=()=>{if(list){out+=`</${list}>`;list=null;}};
  for(const raw of lines){
    const l=raw.trimEnd(); let m;
    if(/^\u0000\d+\u0000$/.test(l.trim())){flushP();flushL();out+=l.trim();continue;}
    if(m=l.match(/^(#{1,3})\s+(.*)/)){flushP();flushL();out+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`;continue;}
    if(m=l.match(/^\s*[-*]\s+(.*)/)){flushP();if(list!=="ul"){flushL();out+="<ul>";list="ul";}out+=`<li>${inline(m[1])}</li>`;continue;}
    if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){flushP();if(list!=="ol"){flushL();out+="<ol>";list="ol";}out+=`<li>${inline(m[1])}</li>`;continue;}
    if(m=l.match(/^&gt;\s?(.*)/)){flushP();flushL();out+=`<blockquote>${inline(m[1])}</blockquote>`;continue;}
    if(!l.trim()){flushP();flushL();continue;}
    flushL();para.push(l);
  }
  flushP();flushL();
  return out.replace(/\u0000(\d+)\u0000/g,(_,i)=>blocks[i]);
}

const SUGGESTIONS=[
  {i:"i-code",t:"Blender Help",d:"Geometry Nodes setup",q:"How do I create a procedural building with geometry nodes in Blender?"},
  {i:"i-pen",t:"Write a script",d:"Python automation",q:"Write a Python script to batch rename files in a directory."},
  {i:"i-globe",t:"Explain AI",d:"Neural networks",q:"Explain how a neural network learns, step by step."},
  {i:"i-spark",t:"Game Dev",d:"Unity or Unreal",q:"What is the difference between Unity and Unreal Engine for beginners?"}
];

function heroHTML(){
  return `<section class="hero">
    <svg class="orbit" style="--s:92px"><use href="#i-orbit"/></svg>
    <h1>Type a <em>command</em> to start</h1>
    <p>Ask about coding, Blender, games, or general knowledge.</p>
    <div class="chips">${SUGGESTIONS.map((s,n)=>`<button class="chip" data-n="${n}"><svg width="18" height="18"><use href="#${s.i}"/></svg><div><b>${s.t}</b><span>${s.d}</span></div></button>`).join("")}</div>
  </section>`;
}
function wireChips(){
  feed.querySelectorAll(".chip").forEach(b=>b.onclick=()=>ask(SUGGESTIONS[b.dataset.n].q));
}
function newChat(){
  controller?.abort();
  chats=chats.filter(hasUser);
  currentId="c"+Date.now(); history=[{role:"model",text:GREETING,greet:true}];
  chats.unshift({id:currentId,updated:Date.now(),history}); persist(); renderSidebar();
  feed.innerHTML=heroHTML(); wireChips();
  const el=addAI(""), prose=el.querySelector(".prose"); el.classList.add("greet");
  let i=0; document.body.classList.add("thinking");
  const tick=()=>{ if(!el.isConnected) return document.body.classList.remove("thinking");
    i++; prose.innerHTML=esc(GREETING.slice(0,i))+(i<GREETING.length?'<span class="cursor"></span>':"");
    if(i<GREETING.length) setTimeout(tick,38); else document.body.classList.remove("thinking"); };
  setTimeout(tick,350);
}
function addUser(text){
  const el=document.createElement("div"); el.className="msg user";
  el.innerHTML=`<div class="bubble"></div>`; el.firstChild.textContent=text; feed.appendChild(el); return el;
}
function wireCodeActions(prose){
  prose.querySelectorAll('.code-block-wrap').forEach(wrap => {
    const code = wrap.querySelector('code').innerText;
    const btnCopy = wrap.querySelector('[data-action="copy"]');
    const btnDl = wrap.querySelector('[data-action="download"]');
    const btnRun = wrap.querySelector('[data-action="run"]');
    if(btnCopy) btnCopy.onclick = () => { navigator.clipboard?.writeText(code).then(()=>{btnCopy.querySelector("use").setAttribute("href","#i-check");setTimeout(()=>btnCopy.querySelector("use").setAttribute("href","#i-copy"),1400);}).catch(()=>{}); };
    if(btnDl) btnDl.onclick = () => { const isHtml = btnDl.dataset.isHtml === 'true'; const ext = isHtml ? 'html' : 'txt'; const blob = new Blob([code], {type: isHtml ? 'text/html' : 'text/plain'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'code.' + ext; a.click(); URL.revokeObjectURL(url); };
    if(btnRun) btnRun.onclick = () => { const win = window.open('', '_blank'); win.document.write('<html><body><scr'+'ipt>' + code + '</scr'+'ipt></body></html>'); win.document.close(); };
  });
}
function addAI(text=""){
  const el=document.createElement("div"); el.className="msg ai";
  el.innerHTML=`<svg class="orbit av"><use href="#i-orbit"/></svg><div class="body"><div class="prose"></div>
    <div class="actions"><button class="iconbtn" data-a="copy" aria-label="Copy"><svg width="16" height="16"><use href="#i-copy"/></svg></button>
    <button class="iconbtn" data-a="retry" aria-label="Regenerate"><svg width="16" height="16"><use href="#i-retry"/></svg></button></div></div>`;
  const prose = el.querySelector(".prose");
  prose.innerHTML=md(text);
  wireCodeActions(prose);
  el.querySelector('[data-a="copy"]').onclick=e=>{
    const btn=e.currentTarget, t=el.dataset.raw||"";
    navigator.clipboard?.writeText(t).then(()=>{btn.querySelector("use").setAttribute("href","#i-check");setTimeout(()=>btn.querySelector("use").setAttribute("href","#i-copy"),1400);}).catch(()=>{});
  };
  el.querySelector('[data-a="retry"]').onclick=()=>regenerate();
  el.dataset.raw=text; feed.appendChild(el); return el;
}
function renderAll(){
  if(!history.length) return newChat();
  const started=history.some(m=>m.role==="user");
  feed.innerHTML=started?"":heroHTML(); if(!started) wireChips();
  history.forEach(m=>{ if(m.role==="user") addUser(m.text); else { const el=addAI(m.text); if(m.greet) el.classList.add("greet"); } });
  toBottom(false);
}
function toBottom(smooth=true){ scroller.scrollTo({top:scroller.scrollHeight,behavior:smooth?"smooth":"auto"}); }

const RETRYABLE=new Set([429,500,502,503,504]);

class ModelError extends Error{ constructor(msg,status){ super(msg); this.status=status; } }
const wait=(ms,run)=>new Promise(r=>{ const t=setTimeout(r,ms); run.onStop.push(()=>{clearTimeout(t);r();}); });

async function stream(onText, run){
  let res;
  try{ res=await fetch(API_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      contents:history.filter(m=>!m.greet).map(m=>({role:m.role==="user"?"user":"model",parts:[{text:m.text}]}))
    })}); }
  catch(e){ throw new ModelError("Couldn't reach the server. Check your internet connection and try again.",0); }
  if(run.stopped) return;
  if(!res.ok){ let msg=`Request failed (${res.status}).`; try{const j=await res.json(); msg=(typeof j.error==="string"?j.error:j.error?.message)||msg;}catch{} throw new ModelError(msg,res.status); }
  const reader=res.body.getReader(), dec=new TextDecoder(); let buf="";
  run.onStop.push(()=>reader.cancel().catch(()=>{}));
  while(!run.stopped){
    let r; try{ r=await reader.read(); }catch{ break; }
    if(r.done||run.stopped) break;
    buf+=dec.decode(r.value,{stream:true});
    let i; while((i=buf.indexOf("\n"))>=0){
      const line=buf.slice(0,i).trim(); buf=buf.slice(i+1);
      if(!line.startsWith("data:")) continue;
      try{ const j=JSON.parse(line.slice(5)); const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join(""); if(t&&!run.stopped) onText(t);}catch{}
    }
  }
}

async function respond(){
  setBusy(true);
  const el=addAI(""), prose=el.querySelector(".prose"); let text="", done=false;
  const run={stopped:false,onStop:[]};
  const status=msg=>{ if(!text) prose.innerHTML=`<p style="color:var(--muted);font-size:13px;margin:0">${esc(msg)}</p><span class="cursor"></span>`; };
  prose.innerHTML='<span class="cursor"></span>'; toBottom();

  const finish=(errMsg)=>{
    if(done) return; done=true;
    if(text){ prose.innerHTML=md(text); el.dataset.raw=text; wireCodeActions(prose); history.push({role:"model",text}); saveChat(); }
    if(errMsg) prose.innerHTML=(text?md(text):"")+`<p class="err">${esc(errMsg)}</p>`;
    else if(!text) el.remove();
    controller=null; setBusy(false);
  };
  controller={ abort(){ run.stopped=true; run.onStop.splice(0).forEach(f=>f()); finish(); } };

  const tries=4; let lastErr=null, anyBusy=false;
  for(let n=0;n<tries && !run.stopped;n++){
    try{
      await stream(t=>{ text+=t; prose.innerHTML=md(text)+'<span class="cursor"></span>'; el.dataset.raw=text; nearBottom()&&toBottom(false); }, run);
      lastErr=null; break;
    }catch(e){
      lastErr=e;
      const busy=RETRYABLE.has(e.status);
      if(text||!busy||n===tries-1) break;
      anyBusy=true;
      status(`The model is busy. Trying again (${n+2} of ${tries})…`);
      await wait(1500*(n+1),run);
    }
  }
  if(run.stopped) return;
  finish(lastErr ? (anyBusy ? "The model is busy right now. Wait a minute, then press the retry button." : lastErr.message) : null);
}
function nearBottom(){ return scroller.scrollHeight-scroller.scrollTop-scroller.clientHeight<140; }

function ask(text){
  text=text.trim(); if(!text||controller) return;
  feed.querySelector(".hero")?.remove();
  history.push({role:"user",text}); saveChat();
  addUser(text); input.value=""; autosize(); respond();
}
function regenerate(){
  if(controller) return;
  if(history.at(-1)?.role==="model" && !history.at(-1).greet) history.pop();
  if(history.at(-1)?.role!=="user") return;
  saveChat(); renderAll(); respond();
}

function openChat(id){
  const c=chats.find(c=>c.id===id); if(!c) return;
  controller?.abort();
  chats=chats.filter(x=>hasUser(x)||x.id===id);
  currentId=id; history=c.history; persist(); renderAll(); renderSidebar(); closeDrawer();
}
function deleteChat(id){
  chats=chats.filter(c=>c.id!==id);
  if(id===currentId){ newChat(); } else { persist(); renderSidebar(); }
}
function renderSidebar(){
  const list=$("#chatlist"), saved=chats.filter(hasUser).sort((a,b)=>b.updated-a.updated);
  if(!saved.length){ list.innerHTML='<p class="empty-side">Your chats will show up here once you send a message.</p>'; return; }
  const day=864e5, start=new Date().setHours(0,0,0,0);
  const bucket=t=> t>=start?"Today": t>=start-day?"Yesterday": t>=start-7*day?"Previous 7 days":"Older";
  let html="", last="";
  for(const c of saved){
    const g=bucket(c.updated); if(g!==last){ html+=`<div class="group">${g}</div>`; last=g; }
    html+=`<div class="chatitem${c.id===currentId?" active":""}" data-id="${c.id}">
      <button class="open" title="${esc(titleOf(c))}">${esc(titleOf(c))}</button>
      <button class="del" aria-label="Delete chat"><svg width="15" height="15"><use href="#i-trash"/></svg></button></div>`;
  }
  list.innerHTML=html;
  list.querySelectorAll(".chatitem").forEach(row=>{
    const id=row.dataset.id, del=row.querySelector(".del");
    row.querySelector(".open").onclick=()=>openChat(id);
    del.onclick=()=>{
      if(del.classList.contains("armed")) return deleteChat(id);
      del.classList.add("armed"); del.textContent="Delete";
      setTimeout(()=>{ if(del.isConnected){ del.classList.remove("armed"); del.innerHTML='<svg width="15" height="15"><use href="#i-trash"/></svg>'; } },2500);
    };
  });
}
const mobile=()=>matchMedia("(max-width:820px)").matches;
function closeDrawer(){ document.body.classList.remove("side-open"); }
$("#sideOpen").onclick=()=>{ if(mobile()) document.body.classList.add("side-open"); else { document.body.classList.remove("side-closed"); store.set("xtroas.sideClosed",false); } };
$("#sideClose").onclick=()=>{ if(mobile()) closeDrawer(); else { document.body.classList.add("side-closed"); store.set("xtroas.sideClosed",true); } };
$("#scrim").onclick=closeDrawer;
$("#sideNew").onclick=()=>{ newChat(); closeDrawer(); input.focus(); };
if(store.get("xtroas.sideClosed",false)) document.body.classList.add("side-closed");

function setBusy(b){
  document.body.classList.toggle("thinking",b);
  send.querySelector("use").setAttribute("href", b?"#i-stop":"#i-send");
  send.setAttribute("aria-label", b?"Stop":"Send");
  send.disabled = !b && !input.value.trim();
}
function autosize(){ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,200)+"px"; if(!controller) send.disabled=!input.value.trim(); }
input.addEventListener("input",autosize);
input.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); ask(input.value);} });
form.addEventListener("submit",e=>{ e.preventDefault(); controller? controller.abort() : ask(input.value); });
$("#newchat").onclick=()=>{ newChat(); input.focus(); };

renderAll();
renderSidebar();
</script>
</body>
